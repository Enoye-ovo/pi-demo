<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>事件倒计时 · Countdown</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0d1b2a;
      --card: rgba(255, 255, 255, 0.04);
      --card-hover: rgba(255, 255, 255, 0.07);
      --border: rgba(200, 182, 255, 0.15);
      --accent: #c8b6ff;
      --accent-2: #b8c1ff;
      --text: #fff;
      --muted: rgba(255, 255, 255, 0.5);
      --danger: #ff8b8b;
    }
    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at top, #1a2a4a 0%, var(--bg) 60%);
      font-family: "Georgia", "Songti SC", -apple-system, "PingFang SC", sans-serif;
      color: var(--text);
      padding: 40px 20px 80px;
    }
    .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    .star { position: absolute; background: #fff; border-radius: 50%; animation: twinkle 3s infinite ease-in-out; }
    @keyframes twinkle { 0%, 100% { opacity: 0.1; } 50% { opacity: 0.7; } }

    .wrap { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 40px; }
    header h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 300;
      letter-spacing: 6px;
      text-shadow: 0 0 40px rgba(200, 182, 255, 0.3);
    }
    header h1 span { color: var(--accent); }
    header p { color: var(--muted); margin-top: 12px; letter-spacing: 2px; font-size: 0.85rem; }

    /* 添加表单 */
    .add-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 32px;
      backdrop-filter: blur(8px);
    }
    .add-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
    .field { flex: 1 1 180px; display: flex; flex-direction: column; gap: 8px; }
    .field label { font-size: 0.75rem; color: var(--muted); letter-spacing: 1px; }
    .field input {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
      color-scheme: dark;
    }
    .field input:focus { border-color: var(--accent); }
    .btn {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #1a1a2e;
      border: none;
      border-radius: 10px;
      padding: 12px 28px;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.2s;
      font-family: inherit;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }
    .btn.ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .btn.ghost:hover { color: var(--text); border-color: var(--accent); }

    /* 事件列表 */
    .events { display: grid; gap: 18px; }
    .event {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 26px 28px;
      backdrop-filter: blur(8px);
      transition: background 0.2s, border-color 0.2s;
      position: relative;
      overflow: hidden;
    }
    .event:hover { background: var(--card-hover); border-color: rgba(200, 182, 255, 0.35); }
    .event.past { opacity: 0.55; }
    .event-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 18px; }
    .event-title { font-size: 1.3rem; letter-spacing: 2px; font-weight: 400; }
    .event-date { font-size: 0.78rem; color: var(--muted); margin-top: 6px; letter-spacing: 1px; }
    .event-del {
      background: transparent; border: none; color: var(--muted);
      cursor: pointer; font-size: 1.1rem; padding: 4px 8px; border-radius: 8px;
      transition: color 0.2s, background 0.2s;
    }
    .event-del:hover { color: var(--danger); background: rgba(255, 139, 139, 0.1); }

    .countdown { display: flex; gap: 14px; flex-wrap: wrap; }
    .cd-unit {
      flex: 1 1 70px;
      text-align: center;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      padding: 14px 6px;
    }
    .cd-num {
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 300;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .cd-label { font-size: 0.7rem; color: var(--muted); margin-top: 8px; letter-spacing: 2px; }
    .event-msg { margin-top: 16px; font-size: 0.9rem; color: var(--accent-2); letter-spacing: 2px; text-align: center; }

    .empty { text-align: center; color: var(--muted); padding: 60px 20px; letter-spacing: 2px; }

    .footer {
      position: fixed; bottom: 24px; width: 100%; text-align: center;
      font-size: 0.72rem; color: rgba(255, 255, 255, 0.15); letter-spacing: 2px; z-index: 1;
    }
    @media (max-width: 520px) {
      .cd-unit { flex: 1 1 60px; padding: 10px 4px; }
      .event { padding: 20px; }
    }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="wrap">
    <header>
      <h1>事件<span>倒计时</span></h1>
      <p>添加你关心的事，让时间替你倒数</p>
    </header>

    <div class="add-box">
      <div class="add-row">
        <div class="field">
          <label>事件名称</label>
          <input type="text" id="evName" placeholder="例如：生日、考试、旅行…" maxlength="40">
        </div>
        <div class="field" style="flex: 0 1 200px;">
          <label>目标时间</label>
          <input type="datetime-local" id="evDate">
        </div>
        <button class="btn" id="addBtn">添加</button>
      </div>
    </div>

    <div class="events" id="events"></div>
  </div>
  <div class="footer">— Enoye —</div>

  <script>
    // 星空背景
    const sc = document.getElementById('stars');
    for (let i = 0; i < 80; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const size = Math.random() * 2 + 0.5;
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.animationDelay = Math.random() * 3 + 's';
      sc.appendChild(s);
    }

    const STORE_KEY = 'pi-demo-countdown-events';
    let events = [];

    function load() {
      try { events = JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
      catch { events = []; }
    }
    function save() { localStorage.setItem(STORE_KEY, JSON.stringify(events)); }

    function pad(n) { return String(n).padStart(2, '0'); }
    function fmtDate(ts) {
      const d = new Date(ts);
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function render() {
      const box = document.getElementById('events');
      if (!events.length) {
        box.innerHTML = '<div class="empty">还没有事件，添加一个开始倒计时吧 ✦</div>';
        return;
      }
      // 按时间升序
      events.sort((a, b) => a.date - b.date);
      box.innerHTML = events.map(ev => {
        return `<div class="event" data-id="${ev.id}">
          <div class="event-head">
            <div>
              <div class="event-title">${escapeHtml(ev.name)}</div>
              <div class="event-date">${fmtDate(ev.date)}</div>
            </div>
            <button class="event-del" data-del="${ev.id}" title="删除">✕</button>
          </div>
          <div class="countdown" data-cd="${ev.id}"></div>
        </div>`;
      }).join('');
      tick();
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function tick() {
      const now = Date.now();
      events.forEach(ev => {
        const el = document.querySelector(`[data-cd="${ev.id}"]`);
        if (!el) return;
        const diff = ev.date - now;
        const card = el.closest('.event');
        if (diff <= 0) {
          card.classList.add('past');
          el.innerHTML = `<div class="event-msg">⏰ 时间到啦！</div>`;
          return;
        }
        card.classList.remove('past');
        const days = Math.floor(diff / 86400000);
        const hours = Math.floor((diff % 86400000) / 3600000);
        const mins = Math.floor((diff % 3600000) / 60000);
        const secs = Math.floor((diff % 60000) / 1000);
        el.innerHTML = `
          <div class="cd-unit"><div class="cd-num">${days}</div><div class="cd-label">天</div></div>
          <div class="cd-unit"><div class="cd-num">${pad(hours)}</div><div class="cd-label">时</div></div>
          <div class="cd-unit"><div class="cd-num">${pad(mins)}</div><div class="cd-label">分</div></div>
          <div class="cd-unit"><div class="cd-num">${pad(secs)}</div><div class="cd-label">秒</div></div>`;
      });
    }

    document.getElementById('addBtn').addEventListener('click', addEvent);
    document.getElementById('evName').addEventListener('keydown', e => { if (e.key === 'Enter') addEvent(); });
    document.getElementById('evDate').addEventListener('keydown', e => { if (e.key === 'Enter') addEvent(); });

    function addEvent() {
      const name = document.getElementById('evName').value.trim();
      const dateVal = document.getElementById('evDate').value;
      if (!name) { alert('请输入事件名称'); return; }
      if (!dateVal) { alert('请选择目标时间'); return; }
      const ts = new Date(dateVal).getTime();
      if (isNaN(ts)) { alert('时间格式不正确'); return; }
      events.push({ id: Date.now() + '-' + Math.random().toString(36).slice(2,7), name, date: ts });
      save();
      document.getElementById('evName').value = '';
      document.getElementById('evDate').value = '';
      render();
    }

    document.getElementById('events').addEventListener('click', e => {
      const id = e.target.getAttribute('data-del');
      if (id) {
        events = events.filter(ev => ev.id !== id);
        save();
        render();
      }
    });

    // 默认示例（仅首次访问时添加）
    function seed() {
      if (localStorage.getItem(STORE_KEY)) return;
      const now = new Date();
      const newYear = new Date(now.getFullYear() + 1, 0, 1, 0, 0).getTime();
      const week = new Date(now.getFullYear(), 11, 25, 0, 0).getTime();
      events = [
        { id: 'seed-1', name: '元旦', date: newYear },
        { id: 'seed-2', name: '圣诞节', date: week }
      ];
      save();
    }

    load();
    seed();
    render();
    setInterval(tick, 1000);
  </script>
</body>
</html>
