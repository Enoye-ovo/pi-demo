<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>七夕 · 马昕妮</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #0d1b2a;
      font-family: "Georgia", "Songti SC", serif;
      overflow: hidden;
    }
    .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    .star {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      animation: twinkle 3s infinite ease-in-out;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.9; }
    }
    .content {
      position: relative;
      z-index: 1;
      text-align: center;
    }
    .date {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.3);
      letter-spacing: 4px;
      margin-bottom: 30px;
    }
    .name {
      font-size: clamp(2rem, 8vw, 4rem);
      color: #fff;
      letter-spacing: 8px;
      font-weight: 300;
      text-shadow: 0 0 40px rgba(200, 182, 255, 0.3);
      animation: fadeIn 2s ease;
    }
    .name span {
      color: #c8b6ff;
    }
    .line {
      width: 0;
      height: 1px;
      background: rgba(200, 182, 255, 0.4);
      margin: 30px auto;
      animation: expand 2s ease 0.5s forwards;
    }
    @keyframes expand { to { width: 200px; } }
    .quote {
      font-size: clamp(0.9rem, 3vw, 1.2rem);
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 3px;
      line-height: 2;
      animation: fadeIn 2s ease 1s backwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .footer {
      position: fixed;
      bottom: 30px;
      width: 100%;
      text-align: center;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.15);
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="content">
    <div class="date">七夕 · 2026</div>
    <div class="name">马<span>昕</span>妮</div>
    <div class="line"></div>
    <div class="quote">银河很远，但你很近</div>
  </div>
  <div class="footer">— Enoye —</div>
  <script>
    const sc = document.getElementById('stars');
    for (let i = 0; i < 80; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const size = Math.random() * 2 + 0.5;
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.animationDelay = Math.random() * 3 + 's';
      sc.appendChild(s);
    }
  </script>
</body>
</html>
