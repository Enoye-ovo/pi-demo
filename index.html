<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阿春 29 · Happy Birthday</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a12;
  --green:#00ff9c;
  --cyan:#22d3ee;
  --amber:#fbbf24;
  --pink:#f472b6;
  --purple:#a78bfa;
  --muted:#6b7280;
}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:#e4e4e7;
  font-family:"SF Mono","Cascadia Code","JetBrains Mono",Consolas,"PingFang SC","Microsoft YaHei",monospace;
  overflow-x:hidden;
}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:1}

/* ===== HERO ===== */
.hero{
  position:relative;z-index:2;
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:20px;
}
.badge{
  font-size:.8rem;color:var(--green);
  border:1px solid rgba(0,255,156,.3);border-radius:20px;
  padding:6px 18px;margin-bottom:30px;
  background:rgba(0,255,156,.05);
  letter-spacing:2px;
  animation:fadeIn .8s ease both;
}
.hero h1{
  font-size:clamp(2.4rem,9vw,5.5rem);
  font-weight:700;letter-spacing:2px;line-height:1.1;
  background:linear-gradient(135deg,var(--amber),var(--pink),var(--cyan));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:fadeIn 1s .2s ease both;
}
.hero .sub{
  font-size:clamp(1rem,3vw,1.5rem);
  color:#aaa;margin-top:18px;letter-spacing:6px;
  animation:fadeIn 1s .5s ease both;
}
.hero .age{
  font-size:clamp(6rem,22vw,14rem);
  font-weight:900;line-height:1;margin:10px 0;
  color:transparent;
  -webkit-text-stroke:2px rgba(251,191,36,.4);
  position:relative;
  animation:fadeIn 1s .4s ease both;
}
.hero .age::after{
  content:'29';position:absolute;inset:0;
  background:linear-gradient(180deg,var(--amber),var(--pink));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  -webkit-text-stroke:0;
  filter:drop-shadow(0 0 30px rgba(251,191,36,.3));
}
.scroll-hint{
  position:absolute;bottom:30px;left:50%;transform:translateX(-50%);
  color:var(--muted);font-size:.75rem;letter-spacing:2px;
  animation:bounce 2s infinite;
}
@keyframes bounce{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(8px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* ===== 蛋糕区 ===== */
.section{position:relative;z-index:2;padding:80px 20px;max-width:800px;margin:0 auto;text-align:center}
.section h2{
  font-size:clamp(1.3rem,4vw,2rem);font-weight:400;letter-spacing:3px;
  margin-bottom:40px;color:#cfcfe0;
}
.section h2 .tag{color:var(--green);font-size:.7rem;vertical-align:super;margin-right:8px}

.cake-stage{
  position:relative;display:inline-block;margin:20px auto;
  filter:drop-shadow(0 0 40px rgba(251,191,36,.2));
}
.cake-svg{width:clamp(220px,50vw,340px);height:auto}

/* ===== 统计卡片 ===== */
.stats{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:16px;margin-top:20px;
}
.stat{
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);
  border-radius:14px;padding:24px 16px;
  transition:.3s;
}
.stat:hover{border-color:rgba(0,255,156,.3);background:rgba(0,255,156,.03);transform:translateY(-4px)}
.stat .num{font-size:2rem;font-weight:700;color:var(--cyan)}
.stat .num.am{color:var(--amber)}
.stat .num.pk{color:var(--pink)}
.stat .num.gr{color:var(--green)}
.stat .label{font-size:.72rem;color:var(--muted);margin-top:8px;letter-spacing:1px}

/* ===== git log 时间线 ===== */
.timeline{text-align:left;margin-top:20px}
.commit{
  display:flex;gap:14px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.06);
  align-items:baseline;
}
.commit:last-child{border:none}
.commit .hash{color:var(--amber);font-size:.82rem;flex-shrink:0;width:70px}
.commit .ref{color:var(--pink);font-size:.72rem;flex-shrink:0;width:90px}
.commit .msg{color:#999;font-size:.85rem;flex:1}
.commit.head .msg{color:#e4e4e7;font-weight:600}

/* ===== 祝福 ===== */
.wishes{text-align:left;max-width:600px;margin:20px auto}
.wish{
  display:flex;gap:12px;padding:12px 0;font-size:.95rem;color:#bbb;
  opacity:0;transform:translateX(-20px);
  transition:opacity .6s,transform .6s;
}
.wish.visible{opacity:1;transform:translateX(0)}
.wish .bullet{color:var(--green);flex-shrink:0}

/* ===== 按钮 ===== */
.actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:30px}
.btn{
  background:rgba(0,255,156,.1);border:1px solid rgba(0,255,156,.3);
  color:var(--green);padding:12px 28px;border-radius:30px;
  font:inherit;font-size:.85rem;letter-spacing:1px;cursor:pointer;
  transition:.25s;
}
.btn:hover{background:rgba(0,255,156,.2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,255,156,.15)}
.btn.pk{background:rgba(244,114,182,.1);border-color:rgba(244,114,182,.3);color:var(--pink)}
.btn.pk:hover{background:rgba(244,114,182,.2);box-shadow:0 8px 24px rgba(244,114,182,.15)}

/* ===== footer ===== */
.footer{
  position:relative;z-index:2;text-align:center;padding:40px 20px 60px;
  color:var(--muted);font-size:.75rem;letter-spacing:2px;
}
.footer .heart{color:var(--pink)}

/* 蜡烛火焰 */
.flame{transform-origin:center bottom;animation:flick .4s infinite alternate}
@keyframes flick{from{transform:scaleY(1) scaleX(1)}to{transform:scaleY(1.15) scaleX(.9)}}

@media(max-width:520px){
  .commit .ref{display:none}
  .section{padding:60px 16px}
}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<!-- HERO -->
<section class="hero">
  <div class="badge">// birthday.exe — running</div>
  <h1>Happy Birthday</h1>
  <div class="sub">阿 春</div>
  <div class="age">29</div>
  <div class="scroll-hint">↓ 向下滚动</div>
</section>

<!-- 蛋糕 -->
<section class="section">
  <h2><span class="tag">$ cat</span>cake.txt</h2>
  <div class="cake-stage">
    <svg class="cake-svg" viewBox="0 0 300 280" xmlns="http://www.w3.org/2000/svg">
      <!-- 蜡烛 -->
      <g id="candles"></g>
      <!-- 顶层 -->
      <rect x="100" y="90" width="100" height="50" rx="4" fill="#fbbf24" opacity=".9"/>
      <rect x="100" y="88" width="100" height="8" rx="4" fill="#f59e0b"/>
      <!-- 中层 -->
      <rect x="75" y="140" width="150" height="55" rx="4" fill="#f472b6" opacity=".85"/>
      <rect x="75" y="138" width="150" height="8" rx="4" fill="#ec4899"/>
      <!-- 底层 -->
      <rect x="50" y="195" width="200" height="60" rx="4" fill="#22d3ee" opacity=".8"/>
      <rect x="50" y="193" width="200" height="8" rx="4" fill="#06b6d4"/>
      <!-- 盘子 -->
      <ellipse cx="150" cy="260" rx="120" ry="10" fill="#1a1a2e"/>
      <!-- 装饰圆点 -->
      <circle cx="120" cy="165" r="4" fill="#fff" opacity=".6"/>
      <circle cx="150" cy="170" r="4" fill="#fff" opacity=".6"/>
      <circle cx="180" cy="165" r="4" fill="#fff" opacity=".6"/>
      <circle cx="90" cy="222" r="4" fill="#fff" opacity=".5"/>
      <circle cx="130" cy="225" r="4" fill="#fff" opacity=".5"/>
      <circle cx="170" cy="225" r="4" fill="#fff" opacity=".5"/>
      <circle cx="210" cy="222" r="4" fill="#fff" opacity=".5"/>
    </svg>
  </div>
  <p style="color:var(--muted);font-size:.85rem;margin-top:10px">纯 SVG 烘焙 · 0 卡路里 · 29 根蜡烛</p>
  <div class="actions">
    <button class="btn" onclick="blowCandles()">💨 吹蜡烛</button>
    <button class="btn pk" onclick="bigBurst()">🎉 撒花</button>
  </div>
</section>

<!-- 统计 -->
<section class="section">
  <h2><span class="tag">$ neofetch</span>life_stats</h2>
  <div class="stats">
    <div class="stat"><div class="num gr">29</div><div class="label">岁 / years</div></div>
    <div class="stat"><div class="num am">10,585</div><div class="label">天 alive</div></div>
    <div class="stat"><div class="num">253,920</div><div class="label">小时 uptime</div></div>
    <div class="stat"><div class="num pk">∞</div><div class="label">bug 待修</div></div>
    <div class="stat"><div class="num am">☕</div><div class="label">咖啡因驱动</div></div>
    <div class="stat"><div class="num gr">0</div><div class="label">次 reboot</div></div>
  </div>
</section>

<!-- git log -->
<section class="section">
  <h2><span class="tag">$ git log</span>--oneline</h2>
  <div class="timeline" id="timeline"></div>
</section>

<!-- 祝福 -->
<section class="section">
  <h2><span class="tag">$ cat</span>wishes.md</h2>
  <div class="wishes" id="wishes"></div>
</section>

<div class="footer">
  <span class="heart">●</span> 给阿春 · 29 岁 · 愿每个 PR 都秒 merge <span class="heart">●</span>
</div>

<script>
/* ===== 彩带 ===== */
const fx=document.getElementById('fx'),ctx=fx.getContext('2d');
function resize(){fx.width=innerWidth;fx.height=innerHeight}
resize();addEventListener('resize',resize);
let P=[];
const COLORS=['#00ff9c','#22d3ee','#fbbf24','#f472b6','#a78bfa','#fff'];
function burst(n=100,fromX){
  const x=fromX??innerWidth/2;
  for(let i=0;i<n;i++){
    P.push({
      x:x+(Math.random()-.5)*100,y:innerHeight/2,
      vx:(Math.random()-.5)*14,vy:Math.random()*-16-3,
      g:.35+Math.random()*.15,w:5+Math.random()*6,h:8+Math.random()*8,
      c:COLORS[i%COLORS.length],rot:Math.random()*6.28,vr:(Math.random()-.5)*.3,life:1
    });
  }
}
function bigBurst(){burst(200);setTimeout(()=>burst(150,innerWidth*.3),200);setTimeout(()=>burst(150,innerWidth*.7),400)}
function loop(){
  ctx.clearRect(0,0,fx.width,fx.height);
  P=P.filter(p=>p.life>0);
  P.forEach(p=>{
    p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life-=.005;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;
    ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();
  });
  requestAnimationFrame(loop);
}
loop();
/* 开屏自动撒花 */
setTimeout(()=>burst(120),600);

/* ===== 蜡烛 ===== */
const candlesG=document.getElementById('candles');
let candlesLit=true;
const positions=[110,130,150,170,190,100,120,140,160,180,200];
// 29 根太挤，放 9 根代表
[110,125,140,155,170,185,200,97,213].forEach((x,i)=>{
  const y=90;
  // 蜡烛杆
  const stick=document.createElementNS('http://www.w3.org/2000/svg','rect');
  stick.setAttribute('x',x-2);stick.setAttribute('y',y-28);stick.setAttribute('width',4);stick.setAttribute('height',28);
  stick.setAttribute('rx',2);stick.setAttribute('fill',i%2?'#f472b6':'#22d3ee');
  candlesG.appendChild(stick);
  // 火焰
  const flame=document.createElementNS('http://www.w3.org/2000/svg','ellipse');
  flame.setAttribute('cx',x);flame.setAttribute('cy',y-32);flame.setAttribute('rx',4);flame.setAttribute('ry',8);
  flame.setAttribute('fill','#fbbf24');flame.classList.add('flame');
  flame.dataset.idx=i;
  candlesG.appendChild(flame);
  // 火焰光晕
  const glow=document.createElementNS('http://www.w3.org/2000/svg','circle');
  glow.setAttribute('cx',x);glow.setAttribute('cy',y-32);glow.setAttribute('r',10);
  glow.setAttribute('fill','#fbbf24');glow.setAttribute('opacity','.2');
  glow.classList.add('flame');glow.dataset.idx=i;
  candlesG.appendChild(glow);
});
function blowCandles(){
  if(!candlesLit)return;
  candlesLit=false;
  document.querySelectorAll('#candles .flame').forEach(f=>f.style.display='none');
  burst(180);
  const note=document.createElement('div');
  note.textContent='愿望已上传到宇宙服务器 · SLA 99.999%';
  note.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:99;font-size:clamp(1rem,4vw,1.6rem);color:#fbbf24;text-shadow:0 0 20px rgba(251,191,36,.5);letter-spacing:2px;animation:fadeIn .5s ease;pointer-events:none';
  document.body.appendChild(note);
  setTimeout(()=>note.remove(),3000);
}

/* ===== git log 时间线 ===== */
const commits=[
  ['29a0f1c','HEAD → main','29 岁：重构人生架构，性能优化 +∞%',true],
  ['28be3d9','origin/main','28 岁：修复深夜熬夜 bug，引入咖啡依赖'],
  ['27cc1a0','','27 岁：新增「成熟稳重」模块（试验性）'],
  ['26fa022','','26 岁：删除多余焦虑，释放内存'],
  ['25de188','','25 岁：合并 quarter-life 分支'],
  ['1a00000','','出生：init commit，万物之始'],
];
const tl=document.getElementById('timeline');
commits.forEach(c=>{
  const d=document.createElement('div');
  d.className='commit'+(c[3]?' head':'');
  d.innerHTML=`<span class="hash">${c[0]}</span><span class="ref">${c[1]||''}</span><span class="msg">${c[2]}</span>`;
  tl.appendChild(d);
});

/* ===== 祝福逐条出现 ===== */
const wishText=[
  'bug 少一点，头发多一点',
  '代码能跑就别动，但该重构就重构',
  'deadline 都是建议，身体是硬性指标',
  '29 岁，技术栈继续升级，别忘记升级生活',
  '少和编译器吵架，多和朋友吃饭',
  '愿你的每个 PR 都秒 merge，每次部署都零 rollback',
];
const wl=document.getElementById('wishes');
wishText.forEach(t=>{
  const d=document.createElement('div');
  d.className='wish';
  d.innerHTML=`<span class="bullet">▸</span><span>${t}</span>`;
  wl.appendChild(d);
});

/* 滚动出现 */
const io=new IntersectionObserver(es=>{
  es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target)}});
},{threshold:.2});
document.querySelectorAll('.wish').forEach(w=>io.observe(w));

/* 滚动到蛋糕区自动小撒花 */
const cakeSec=document.querySelector('.section');
const io2=new IntersectionObserver(es=>{
  es.forEach(e=>{if(e.isIntersecting)burst(60)});
},{threshold:.5});
io2.observe(cakeSec);
</script>
</body>
</html>
